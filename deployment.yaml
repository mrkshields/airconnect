apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    description: LAN airconnect
  creationTimestamp: null
  labels:
    app: airconnect
  name: airconnect
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: airconnect
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        description: LAN airconnect
      creationTimestamp: null
      labels:
        app: airconnect
      name: airconnect
    spec:
      containers:
      - env:
        - name: TZ
          value: America/New_York
        image: 1activegeek/airconnect:1.12.3
        imagePullPolicy: IfNotPresent
        name: airconnect
        resources:
          requests:
            cpu: "50m"
            memory: "32Mi"
          limits:
            cpu: "200m"
            memory: "128Mi"
      dnsPolicy: ClusterFirstWithHostNet
      hostNetwork: true
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 30
status: {}
